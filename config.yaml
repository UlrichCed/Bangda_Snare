# Configuration centralisée du honeypot HTTP/API anti-attaques-IA.
# Renseigner identity.production_domain et identity.decoy_hostname avant tout
# déploiement réel — ne jamais laisser ces valeurs génériques en production.

server:
  host: "0.0.0.0"
  port: 8080
  fake_app_name: "Aegis Internal Portal"
  fake_version: "3.4.1"
  # X-Forwarded-For n'est honoré que pour les connexions provenant de ces
  # réseaux. Laisser vide si le honeypot est exposé directement : sinon
  # n'importe qui peut forger l'en-tête et fausser l'attribution d'IP.
  # Exemple derrière un nginx local : ["127.0.0.1/32", "::1/128"]
  trusted_proxies: []

identity:
  # À remplacer par le vrai domaine de production que ce honeypot imite.
  production_domain: "example-corp.internal"
  # Nom d'hôte fictif présenté par le honeypot (jamais le vrai hostname).
  decoy_hostname: "app-prod-02.example-corp.internal"
  use_domain_branding: true

# Éviction du registre de sessions en mémoire : sans plafond, scanner le
# honeypot suffirait à le faire gonfler indéfiniment.
sessions:
  ttl_seconds: 3600
  max_tracked: 10000
  eviction_interval_seconds: 60

detection:
  suspicion_threshold: 40
  # Chaque signal ne vaut son poids qu'une fois par session : le score
  # mesure des propriétés prouvées, pas un volume de requêtes.
  # Un scanner banal plafonne à 75 (12+10+10+8+15+20) et ne peut donc pas
  # atteindre le seuil d'aveu sans déclencher un signal discriminant.
  confess_requires_discriminating_signal: true
  timing_window_requests: 5
  timing_variance_threshold: 0.15
  weights:
    known_agent_useragent: 25
    http_lib_useragent: 12
    missing_browser_headers: 10
    no_static_asset_fetch: 8
    regular_timing: 20
    fast_sequential_requests: 10
    wordlist_like_enumeration: 15
    bait_token_followed: 50
    prompt_injection_obeyed: 60
    semantic_canary_solved: 70
  known_agent_ua_patterns:
    - "langchain"
    - "autogpt"
    - "auto-gpt"
    - "crewai"
    - "browser-use"
    - "smolagents"
    - "agentgpt"
    - "gpt-engineer"
    - "babyagi"
    - "openai-agent"
    - "anthropic-agent"
    - "claude-agent"
    - "computer-use"
    - "agentic"
  http_lib_ua_patterns:
    - "python-requests"
    - "python-urllib"
    - "curl/"
    - "wget/"
    - "httpx"
    - "aiohttp"
    - "axios"
    - "go-http-client"
    - "okhttp"
    - "java/"
    - "libwww-perl"
    - "scrapy"

deflection:
  tarpit_base_delay: 0.4
  tarpit_max_delay: 6.0
  tarpit_jitter_pct: 0.20
  maze_max_depth: 4
  bait_token_prefix: "bait_"
  confess_threshold: 80
  confess_report_path: "/api/v1/security/self-report"

canary:
  enabled: true
  fake_aws_key_prefix: "AKIA"
  fake_db_host: "db-shard-internal.example-corp.internal"
  # Les faux secrets sont dérivés de ce sel + l'identifiant de session : ils
  # restent donc stables pour une session, ce qui permet de les enregistrer
  # auprès d'un service externe de canary tokens. À personnaliser.
  derivation_salt: "change-me-honeypot-canary-v1"

logging:
  file: "logs/honeypot.jsonl"
  alert_on_score_above: 60
  rotate_max_bytes: 52428800  # 50 Mio
  rotate_backup_count: 5

alerting:
  email:
    enabled: false
    smtp_host: "localhost"
    smtp_port: 587
    smtp_use_tls: true
    smtp_username: "alerts@example-corp.internal"
    # Le mot de passe SMTP n'est JAMAIS stocké ici : il est lu depuis la
    # variable d'environnement nommée ci-dessous, au runtime uniquement.
    smtp_password_env_var: "HONEYPOT_SMTP_PASSWORD"
    from_addr: "honeypot-alerts@example-corp.internal"
    to_addrs:
      - "soc@example-corp.internal"
    min_score_for_email: 60
    send_on_confession: true

llm_assist:
  enabled: false
  model: "claude-sonnet-5"

anti_fingerprint:
  enabled: true
  fake_server_header: "nginx"
  remove_headers:
    - "X-Powered-By"
