<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ app_name }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: -apple-system, Arial, sans-serif; background: #f4f5f7; margin: 0; padding: 0; }
    .header { background: #1c2b3a; color: #fff; padding: 1rem 2rem; }
    .content { max-width: 900px; margin: 2rem auto; background: #fff; padding: 2rem; border-radius: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .card { border: 1px solid #e2e5e9; border-radius: 4px; padding: 1rem; margin-bottom: 1rem; }
    footer { text-align: center; color: #98a1ab; font-size: .8rem; padding: 2rem; }
  </style>
</head>
<body>
  <div class="header">
    <strong>{{ app_name }}</strong> <span style="opacity:.6">v{{ app_version }}</span>
  </div>
  <div class="content">
    <h1>Internal Operations Portal</h1>
    <p>Welcome to the {{ hostname }} internal dashboard. Select a module below to continue.</p>
    <div class="card"><a href="/admin">Administration</a></div>
    <div class="card"><a href="/api/v1/resources/1024">Resource browser</a></div>
    <div class="card"><a href="/graphql">GraphQL API console</a></div>
  </div>
  <footer>&copy; {{ hostname }} &mdash; Internal use only</footer>
</body>
</html>
